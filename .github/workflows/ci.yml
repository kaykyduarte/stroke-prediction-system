name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Executar testes
        run: python -m pytest -q
  
  docker-build:
    name: Build Docker image with synthetic artifact
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar dependencias de execucao
        run: python -m pip install -r requirements.txt

      - name: Gerar artefato sintetico
        run: python -m scripts.generate_ci_artifact --output artifacts/stroke_model.joblib

      - name: Construir imagem exclusiva de CI
        run: docker build -t stroke-prediction-api:ci .
