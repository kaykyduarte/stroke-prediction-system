name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Executar testes
        run: python -m pytest -q
  
  docker-build:
    name: Build Docker image with synthetic artifact
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar dependencias de execucao
        run: python -m pip install -r requirements.txt

      - name: Gerar artefato sintetico
        run: python -m scripts.generate_ci_artifact --output artifacts/stroke_model.joblib

      - name: Construir imagem exclusiva de CI
        run: docker build -t stroke-prediction-api:ci .
      
      - name: Iniciar container
        run: |
          docker run -d \
            --name stroke-ci-api \
            -p 8000:8000 \
            stroke-prediction-api:ci
      
      - name: Verificar health e readiness
        run: |
          for endpoint in health ready; do
            curl --fail --silent --show-error \
              --connect-timeout 2 \
              --max-time 5 \
              --retry 20 \
              --retry-all-errors \
              --retry-delay 1 \
              --retry-max-time 60 \
              "http://127.0.0.1:8000/$endpoint"
          done

      - name: Exibir logs em caso de falha
        if: failure()
        run: |
          if docker container inspect stroke-ci-api > /dev/null 2>&1; then
            docker inspect --format '{{json .State}}' stroke-ci-api
            docker logs --timestamps stroke-ci-api
          fi

      - name: Encerrar container
        if: always()
        run: |
          if docker container inspect stroke-ci-api > /dev/null 2>&1; then
            docker rm -f stroke-ci-api
          fi
